[general]
static = yes
writeprotect = yes
clearglobalvars = no

; Invoke ONLY with the local CLI command documented in SETUP.md.
; There are no outbound trunks, phone numbers, SIP registrations or wildcard routes.
[callai-local]
exten => 7000,1,Answer()
 same => n,Set(TIMEOUT(absolute)=90)
 same => n,Set(CALLAI_CALL_UUID=${UUID()})
 same => n,NoOp(Experimental CallAI AudioSocket call ${CALLAI_CALL_UUID})
 same => n,AudioSocket(${CALLAI_CALL_UUID},${ENV(CALLAI_AUDIO_SOCKET_TARGET)})
 same => n,Hangup()

; The opposite Local-channel leg supplies a prerecorded caller utterance.
; .sln must be headerless PCM signed 16-bit LE, mono, 8000 Hz.
[callai-fixture]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=85)
 same => n,MixMonitor(/recordings/mixed-${UNIQUEID}.wav,r(/recordings/assistant-${UNIQUEID}.wav)t(/recordings/caller-${UNIQUEID}.wav))
 same => n,Wait(1)
 same => n,Playback(/fixtures/input)
 same => n,Wait(60)
 same => n,StopMixMonitor()
 same => n,Hangup()
